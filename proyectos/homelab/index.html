    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link rel="stylesheet" href="../../styles.css">
        <style>
        .cansat-photo {
            width: 100%;
            max-width: 480px;
            display: block;
            margin: 16px auto 24px;
            border-radius: 8px;
            box-shadow: 0 4px 14px rgba(0, 0, 0, 0.18);
        }
        .cansat-photo-small {
            max-width: 320px;
        }
        .cansat-photo-big {
            max-width: 940px;
        }
        .cansat-gallery-row {
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
            justify-content: center;
            margin: 16px 0 24px;
        }
        .cansat-gallery-row .cansat-photo {
            margin: 0;
            flex: 1 1 240px;
            max-width: 320px;
        }
        .cansat-component {
            margin-bottom: 28px;
        }
        .cansat-component strong {
            display: block;
            margin-bottom: 6px;
            font-size: 1.02em;
        }
        .cansat-specs {
            margin-left: 20px;
            margin-bottom: 16px;
        }
        @media (max-width: 640px) {
            .cansat-gallery-row {
                flex-direction: column;
                align-items: center;
            }
        }
        .services-section {
            padding: 48px 40px;
            font-family: "Poppins", system-ui, sans-serif;
        }

        .services-section__title {
            color: #ffffff;
            font-size: 28px;
            font-weight: 700;
            margin: 0 0 20px 0;
        }

        .services-section__divider {
            border: none;
            border-top: 1px dashed #3a3a3a;
            margin: 0 0 32px 0;
        }

        .services-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 16px;
        }

        .service-card {
            background: black;
            border: 1px solid #2a2a2a;
            border-radius: 12px;
            padding: 20px;
            transition: border-color 0.2s ease, transform 0.2s ease;
        }

        .service-card:hover {
            border-color: #444444;
            transform: translateY(-2px);
        }

        .service-card__header {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 12px;
        }

        .service-card__icon {
            width: 32px;
            height: 32px;
            flex-shrink: 0;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        .service-card__icon img {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }

        .service-card__name {
            color: #ffffff;
            font-size: 17px;
            font-weight: 600;
            margin: 0;
        }

        .service-card__desc {
            color: #a3a3a3;
            font-size: 14px;
            line-height: 1.5;
            margin: 0;
        }

        /* Responsive: 2 columnas en tablet, 1 en móvil */
        @media (max-width: 900px) {
            .services-grid {
                grid-template-columns: repeat(2, 1fr);
            }
        }

        @media (max-width: 560px) {
            .services-section {
                padding: 32px 20px;
            }
            .services-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

    <script src="../../script.js"></script>
    <script>
        document.addEventListener('click', (e) => {
            const backLink = e.target.closest('.project-back-link');
            if (!backLink) return;
            const href = backLink.getAttribute('href');
            if (!href) return;
            e.preventDefault();
            document.body.classList.add('is-returning-to-projects');
            window.setTimeout(() => {
                window.location.href = href;
            }, 110);
        });
    </script>
