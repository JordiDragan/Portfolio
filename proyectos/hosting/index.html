    <script>
        document.addEventListener('click', (e) => {
            const backLink = e.target.closest('.project-back-link');
            if (!backLink) return;
            const href = backLink.getAttribute('href');
            if (!href) return;
            e.preventDefault();
            document.body.classList.add('is-returning-to-projects');
            window.setTimeout(() => {
                window.location.href = href;
            }, 110);
        });

        // Carrusel de fotos: arrastrable (ratón/táctil) + botones + puntos
        (function () {
            const track = document.getElementById('carousel-track');
            const prevBtn = document.getElementById('carousel-prev');
            const nextBtn = document.getElementById('carousel-next');
            const dotsWrap = document.getElementById('carousel-dots');
            if (!track || !prevBtn || !nextBtn || !dotsWrap) return;

            const slides = Array.from(track.children);
            let index = 0;
            let isDragging = false;
            let startX = 0;
            let startTranslate = 0;
            let currentTranslate = 0;

            // Crear los puntos indicadores
            slides.forEach((_, i) => {
                const dot = document.createElement('button');
                dot.setAttribute('aria-label', 'Ir a la foto ' + (i + 1));
                dot.style.cssText = 'width:8px;height:8px;border-radius:50%;border:none;cursor:pointer;background:' + (i === 0 ? '#fff' : 'rgba(255,255,255,0.4)') + ';padding:0;';
                dot.addEventListener('click', () => goTo(i));
                dotsWrap.appendChild(dot);
            });

            function updateDots() {
                Array.from(dotsWrap.children).forEach((dot, i) => {
                    dot.style.background = i === index ? '#fff' : 'rgba(255,255,255,0.4)';
                });
            }

            function goTo(i) {
                index = Math.max(0, Math.min(slides.length - 1, i));
                currentTranslate = -index * track.clientWidth;
                track.style.transition = 'transform 0.3s ease';
                track.style.transform = 'translateX(' + currentTranslate + 'px)';
                updateDots();
            }

            prevBtn.addEventListener('click', () => goTo(index - 1));
            nextBtn.addEventListener('click', () => goTo(index + 1));

            function dragStart(clientX) {
                isDragging = true;
                startX = clientX;
                startTranslate = -index * track.clientWidth;
                track.style.transition = 'none';
                track.style.cursor = 'grabbing';
            }

            function dragMove(clientX) {
                if (!isDragging) return;
                const delta = clientX - startX;
                track.style.transform = 'translateX(' + (startTranslate + delta) + 'px)';
            }

            function dragEnd(clientX) {
                if (!isDragging) return;
                isDragging = false;
                track.style.cursor = 'grab';
                const delta = clientX - startX;
                const threshold = track.clientWidth * 0.15;
                if (delta < -threshold && index < slides.length - 1) {
                    index++;
                } else if (delta > threshold && index > 0) {
                    index--;
                }
                goTo(index);
            }

            // Ratón
            track.addEventListener('mousedown', (e) => dragStart(e.clientX));
            window.addEventListener('mousemove', (e) => dragMove(e.clientX));
            window.addEventListener('mouseup', (e) => dragEnd(e.clientX));

            // Táctil
            track.addEventListener('touchstart', (e) => dragStart(e.touches[0].clientX), { passive: true });
            track.addEventListener('touchmove', (e) => dragMove(e.touches[0].clientX), { passive: true });
            track.addEventListener('touchend', (e) => dragEnd(e.changedTouches[0].clientX));

            // Recalcular posición si cambia el tamaño de la ventana
            window.addEventListener('resize', () => goTo(index));

            goTo(0);
        })();
    </script>
